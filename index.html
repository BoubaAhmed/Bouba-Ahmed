<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ahmed Bouba portfolio - full-stack and AI developer building intelligent products and clean web systems."
    />
    <meta name="theme-color" content="#1A2A80" />
    <meta property="og:title" content="Ahmed Bouba | Full Stack & AI Developer" />
    <meta
      property="og:description"
      content="Portfolio website for Ahmed Bouba featuring full-stack engineering, AI work, and selected projects."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />
    <title>Ahmed Bouba | Full Stack & AI Developer</title>
    <script>
      (() => {
        const stored = localStorage.getItem("portfolio-theme");
        const shouldUseDark =
          stored === "dark" ||
          (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (shouldUseDark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
